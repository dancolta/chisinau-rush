<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#120d16" />
    <title>Chișinău Rush</title>
    <meta name="description" content="Chișinău Rush: un joc open-world satiric în centrul Chișinăului. De la plecat peste hotare la primar." />
  </head>
  <body>
    <div id="app">
      <div id="viewport"></div>
      <div id="ui"></div>
      <div id="boot" class="boot">
        <div class="boot-art"></div>
        <div class="boot-shade"></div>
        <div class="boot-inner">
          <div class="boot-logo">CHIȘINĂU <span>RUSH</span></div>
          <div class="boot-bar"><i id="boot-fill"></i></div>
          <div class="boot-status" id="boot-status">Se încarcă Chișinăul…</div>
          <div class="boot-tip" id="boot-tip"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
